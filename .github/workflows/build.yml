name: Build Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        shell: powershell
        run: .\package.ps1
      - name: Check command line
        shell: powershell
        run: |
          & .\dist\Fuji-S3-S5-RAW-Converter\data\s5raw.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI startup failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Fuji-S3-S5-RAW-Converter-Windows
          path: dist/*-Windows.zip
          if-no-files-found: error
          compression-level: 0
